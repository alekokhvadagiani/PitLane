services:
  api:
    build:
      context: .
      dockerfile: src/PitLane.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: src/pitlane-web/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    restart: unless-stopped
