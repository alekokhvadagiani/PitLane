server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Replay windows are about 1 MB of JSON; compressed they travel ~10x smaller.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/problem+json application/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /assets/ {
        # Vite file names carry a content hash.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
